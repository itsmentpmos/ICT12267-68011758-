<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>68011758 Natthapon Mingma</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="form-css.css">
  </head>
  <body>

    <video id="bgVideo" autoplay loop muted playsinline>
      <source src="VDO/204006-923133925_small.mp4" type="video/mp4">
    </video>

    <div class="page-wrapper">

      <div class="form-card">
        <h2>แบบฟอร์มลงทะเบียน</h2>
        <form action="#" method="post">

          <div class="mb-3">
            <label class="form-label">ชื่อ-นามสกุล:</label>
            <input type="text" class="form-control" placeholder="กรุณากรอกชื่อ-นามสกุล" required>
          </div>

          <div class="mb-3">
            <label class="form-label">อีเมล:</label>
            <input type="email" class="form-control" placeholder="example@domain.com" required>
          </div>

          <div class="mb-3">
            <label class="form-label">รหัสผ่าน:</label>
            <input type="password" class="form-control" required>
          </div>

          <div class="mb-3">
            <label class="form-label">เพศ:</label>&nbsp;
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" name="gender" id="male" value="male">
              <label class="form-check-label" for="male">ชาย</label>
            </div>
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" name="gender" id="female" value="female">
              <label class="form-check-label" for="female">หญิง</label>
            </div>
          </div>

          <div class="mb-4">
            <label class="form-label">ตำแหน่ง:</label>
            <select class="form-select" required>
              <option value="" selected disabled>Please select a position</option>
              <option value="manager">Manager</option>
              <option value="developer">Developer</option>
              <option value="designer">Designer</option>
              <option value="marketing">Marketing</option>
            </select>
          </div>

          <div class="text-center">
            <button type="submit" class="btn btn-submit me-2">ลงทะเบียน</button>
            <button type="reset" class="btn btn-reset">ล้างข้อมูล</button>
          </div>

        </form>
      </div>

      <div class="video-controls">
        <button class="btn btn-play me-2" onclick="document.querySelector('#bgVideo').play()">&#9654; Play</button>
        <button class="btn btn-stop" onclick="document.querySelector('#bgVideo').pause()">&#9209; Stop</button>
      </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
